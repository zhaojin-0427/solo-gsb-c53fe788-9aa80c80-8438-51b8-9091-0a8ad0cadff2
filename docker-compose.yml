services:
  pv-trial-bench:
    build: .
    container_name: pv-trial-bench
    ports:
      - "8000:8000"
    volumes:
      - pv-trial-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pv-trial-data:
